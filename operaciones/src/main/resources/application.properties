spring.application.name=operaciones

spring.config.import=optional:file:./application-secrets.properties

spring.datasource.url=jdbc:postgresql://postgresql-nexuserp.alwaysdata.net:5432/nexuserp_nexuscloud
spring.datasource.username=nexuserp
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.expiration-ms=28800000

app.upload.perfiles-dir=uploads/perfiles
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.recomendador.url=https://apirecomendaciones-production.up.railway.app
app.monitoreo.timeout-ms=3000