spring.application.name=operaciones
 
# PostgreSQL - AlwaysData
spring.datasource.url=jdbc:postgresql://postgresql-nexuserp.alwaysdata.net:5432/nexuserp_nexuscloud
spring.datasource.username=nexuserp
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
 
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
 
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
 
# Archivos
app.upload.perfiles-dir=uploads/perfiles
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
 
# Servicios externos
app.recomendador.url=https://apirecomendaciones-production.up.railway.app
app.monitoreo.timeout-ms=3000
 
# Railway
server.port=${PORT:8080}